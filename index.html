<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Kallpa SIG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Distribución: barra superior y lateral azul noche (identidad del SIG en Django), contenido en tarjetas sobre fondo frío; naranja = acción, "Nuevo" = mejora 2.0 */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#f7f8fb; --fg:#18202e; --muted:#5a6476; --line:#e1e5ed;
  --navy:#111a2b; --navy2:#1b2638; --navy-fg:#dfe5ef; --navy-muted:#8e9ab0;
  --accent:#f39c12; --accent-ink:#9a5a00; --accent-soft:#fff3df;
  --ok:#1b8a4c; --ok-soft:#e3f5ea; --warn:#a96d00; --warn-soft:#fff4d6; --bad:#c3303b; --bad-soft:#fde8ea; --info:#2160c4; --info-soft:#e6efff;
  --new:#7a3fd1; --new-soft:#f1eaff;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#151c2b; --surface2:#1a2233; --fg:#e5e9f0; --muted:#9aa4b6; --line:#273149;
  --navy:#0a101c; --navy2:#121b2b; --navy-fg:#dfe5ef; --navy-muted:#8794ab;
  --accent:#f5a524; --accent-ink:#f7b955; --accent-soft:#3a2a10;
  --ok:#43c27c; --ok-soft:#123323; --warn:#e2b04a; --warn-soft:#3a2e10; --bad:#f06a73; --bad-soft:#3d171c; --info:#6aa1ff; --info-soft:#14274a;
  --new:#b28cf5; --new-soft:#2a1d45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#151c2b; --surface2:#1a2233; --fg:#e5e9f0; --muted:#9aa4b6; --line:#273149;
  --navy:#0a101c; --navy2:#121b2b; --navy-fg:#dfe5ef; --navy-muted:#8794ab;
  --accent:#f5a524; --accent-ink:#f7b955; --accent-soft:#3a2a10;
  --ok:#43c27c; --ok-soft:#123323; --warn:#e2b04a; --warn-soft:#3a2e10; --bad:#f06a73; --bad-soft:#3d171c; --info:#6aa1ff; --info-soft:#14274a;
  --new:#b28cf5; --new-soft:#2a1d45; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-fg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--accent)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--navy-muted);font-size:12px;display:block}
.ver{font-family:var(--mono);font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:1px 8px}
.top .sp{flex:1}
.userbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rolechip{background:var(--accent);color:#1b1200;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px}
.tbtn{background:transparent;border:1px solid #3a4760;color:var(--navy-fg);border-radius:7px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative}
.tbtn:hover{border-color:var(--accent)}
.dot{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;font-weight:700}
/* esqueleto */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100% - 56px)}
.side{background:var(--navy2);color:var(--navy-fg);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side h6{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-muted);margin:14px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--navy-fg);border:0;background:transparent;text-align:left;width:100%;font-size:13.5px}
.nav:hover{background:#ffffff10}
.nav.on{background:#ffffff14;box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{flex:none;opacity:.85}
.nav .nw{margin-left:auto}
.main{min-width:0;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:24px;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:14px;margin:4px 0 8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--line)}
.kpi .l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.ok{border-top-color:var(--ok)}.kpi.bad{border-top-color:var(--bad)}.kpi.warn{border-top-color:var(--warn)}.kpi.info{border-top-color:var(--info)}.kpi.nv{border-top-color:var(--new)}
/* botones */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1200}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dan{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav:focus-visible,.tbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;border:1px solid transparent}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-info{background:var(--info-soft);color:var(--info)}.c-mut{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.c-acc{background:var(--accent-soft);color:var(--accent-ink)}
.nw{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--new);background:var(--new-soft);border:1px solid color-mix(in srgb,var(--new) 35%,transparent);border-radius:5px;padding:1px 6px;white-space:nowrap}
.side .nw{background:#7a3fd133;color:#d8c4ff;border-color:#a77cf055}
.newbox{border:1px dashed color-mix(in srgb,var(--new) 55%,transparent);background:color-mix(in srgb,var(--new-soft) 55%,var(--surface));border-radius:var(--r);padding:12px 14px}
/* tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--surface2);text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:12px}
/* formularios */
.fg{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
label.l,.f>label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface2);cursor:pointer;font-size:13px}
.ck input{accent-color:var(--accent);width:16px;height:16px}
.err{color:var(--bad);font-size:12.5px}
.hint{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.toolbar .f{min-width:150px;flex:1}
/* listas y pasos */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.item .grow{flex:1;min-width:0}
.tl{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative}
.tl .ev::before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .ev.acc::before{border-color:var(--accent)}.tl .ev.bad::before{border-color:var(--bad)}.tl .ev.ok::before{border-color:var(--ok)}.tl .ev.nv::before{border-color:var(--new)}
.tl .ev small{color:var(--muted);display:block}
.verdict{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.v-ok{background:var(--ok-soft)}.v-bad{background:var(--bad-soft)}.v-warn{background:var(--warn-soft)}
.v-ok b{color:var(--ok)}.v-bad b{color:var(--bad)}.v-warn b{color:var(--warn)}
.rule{font-family:var(--mono);font-size:12px;font-weight:600}
/* calendario */
.cal{display:grid;grid-template-columns:170px repeat(7,minmax(110px,1fr));min-width:960px}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:52px}
.cal .hd{background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted)}
.cal .hd.today{color:var(--accent-ink)}
.ev-b{display:block;border-radius:6px;padding:4px 6px;font-size:11.5px;margin-bottom:4px;background:var(--info-soft);color:var(--info);border-left:3px solid var(--info)}
.ev-b.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}.ev-b.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}.ev-b.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
/* modal y aviso */
.ov{position:fixed;inset:0;background:#0a0f1a99;display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;
  padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:min(760px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(980px,100%)}
.modal .mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.modal .mh h2{font-size:18px}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100% - 32px))}
.toast div{background:var(--navy);color:var(--navy-fg);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 6px 24px #0004;font-size:13px}
.toast div.bad{border-left-color:var(--bad)}.toast div.ok{border-left-color:var(--ok)}
/* acceso */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);padding-block:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbox{width:min(760px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lhead{background:var(--navy);color:var(--navy-fg);padding:24px;border-bottom:3px solid var(--accent);display:flex;gap:14px;align-items:center}
.lhead h1{font-size:22px}.lhead p{margin:2px 0 0;color:var(--navy-muted)}
.lbody{padding:22px;display:flex;flex-direction:column;gap:14px}
.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ucard{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface2);text-align:left;display:flex;flex-direction:column;gap:3px}
.ucard:hover{border-color:var(--accent)}
.ucard b{font-size:14px}.ucard span{color:var(--muted);font-size:12.5px}
/* gráficos */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .lbl{fill:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.mbtn{display:none}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px;gap:4px}
  .side h6{display:none}
  .nav{width:auto;white-space:nowrap}
  .g2,.g3,.g4,.fg{grid-template-columns:1fr}
  .brand small{display:none}
}
@media (prefers-reduced-motion:no-preference){.toast div{animation:tin .25s ease-out}@keyframes tin{from{transform:translateY(8px);opacity:0}}}
</style>

<script>
'use strict';
/* =====================================================================
   Kallpa SIG - prototipo navegable (versión 1.0 + mejoras 2.0)
   Todos los nombres de personas, clientes y unidades son ficticios.
   ===================================================================== */
const KEY = 'kallpa-sig-proto-v3';
const CATS = ['A-I','A-IIa','A-IIb','A-IIIa','A-IIIb','A-IIIc'];
const DESCANSO_H = 8, LIMITE_SEMANA_H = 60, SUENO_MIN = 6, DIAS_COBRO = 15;
const ROLES = {
  admin: { nombre: 'Administrador de operaciones', usuario: 'Rosa Quispe' },
  sup: { nombre: 'Supervisor', usuario: 'Carlos Mendoza' },
  ger: { nombre: 'Gerencia', usuario: 'Ana Torres' },
  fin: { nombre: 'Finanzas', usuario: 'Milagros Ccama', nuevo: true },
  cond: { nombre: 'Conductor', usuario: 'Juan Alberto Pérez Quispe', conductorId: 'C1' },
};

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const isoD = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = isoD(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return isoD(d); };
const diffDays = (a, b) => Math.round((new Date(a + 'T12:00') - new Date(b + 'T12:00')) / 864e5);
const fd = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const nowStamp = () => { const d = new Date(); return `${isoD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fdt = (s) => s ? `${fd(s.slice(0, 10))} ${s.slice(11, 16)}` : '—';
const money = (n) => 'S/ ' + Number(n || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const yearsSince = (s) => { if (!s) return 0; return Math.floor(diffDays(TODAY, s) / 365.25); };
let seq = Date.now() % 100000;
const uid = (p) => `${p}${++seq}`;

/* ---------- estado ---------- */
let S = null;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* almacenamiento no disponible */ } }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.version === 3) return d; } } catch (e) { /* sin acceso */ }
  return null;
}

function seed() {
  const D = (n) => addDays(TODAY, n);
  const st = {
    version: 3, rol: null, ui: { view: 'inicio', filtros: {} }, rechazos: 0, ultimoEscaneo: null,
    tipos: [
      { id: 'T1', nombre: 'Camioneta 4x4', asientos: 4, expMin: 3, cat: 'A-IIa', activo: true },
      { id: 'T2', nombre: 'Van / Sprinter', asientos: 15, expMin: 3, cat: 'A-IIb', activo: true },
      { id: 'T3', nombre: 'Minibús', asientos: 30, expMin: 5, cat: 'A-IIIa', activo: true },
      { id: 'T4', nombre: 'Bus', asientos: 45, expMin: 5, cat: 'A-IIIa', activo: true },
    ],
    tiposDoc: [
      { id: 'D1', nombre: 'Licencia de conducir', aplica: 'C', vence: true, bloq: true, tipos: [], dias: 30, v1: true },
      { id: 'D2', nombre: 'Certificado de manejo defensivo', aplica: 'C', vence: true, bloq: true, tipos: [], dias: 30 },
      { id: 'D3', nombre: 'Inducción en mina', aplica: 'C', vence: true, bloq: true, tipos: [], dias: 30 },
      { id: 'D4', nombre: 'Examen médico ocupacional', aplica: 'C', vence: true, bloq: true, tipos: [], dias: 30, v1: true },
      { id: 'D5', nombre: 'Seguro Vida Ley', aplica: 'C', vence: true, bloq: true, tipos: [], dias: 30 },
      { id: 'D6', nombre: 'Récord de conductor', aplica: 'C', vence: true, bloq: false, tipos: [], dias: 30 },
      { id: 'D7', nombre: 'SOAT', aplica: 'V', vence: true, bloq: true, tipos: [], dias: 30 },
      { id: 'D8', nombre: 'Revisión técnica', aplica: 'V', vence: true, bloq: true, tipos: [], dias: 30, v1: true },
      { id: 'D9', nombre: 'Póliza contra todo riesgo', aplica: 'V', vence: true, bloq: true, tipos: [], dias: 30, v1: true },
      { id: 'D10', nombre: 'Seguro de ocupantes', aplica: 'V', vence: true, bloq: true, tipos: ['T3', 'T4'], dias: 30 },
      { id: 'D11', nombre: 'Tarjeta de propiedad', aplica: 'V', vence: false, bloq: true, tipos: [], dias: 30 },
      { id: 'D12', nombre: 'Certificado de GPS', aplica: 'V', vence: true, bloq: true, tipos: [], dias: 30 },
    ],

/* ---------- consultas de dominio ---------- */
const tipo = (id) => S.tipos.find((t) => t.id === id) || { nombre: '—', asientos: 0, expMin: 0, cat: 'A-I' };
const tdoc = (id) => S.tiposDoc.find((t) => t.id === id);
const cond = (id) => S.conductores.find((c) => c.id === id);
const veh = (id) => S.vehiculos.find((v) => v.id === id);
const solx = (id) => S.solicitudes.find((s) => s.id === id);
const cli = (id) => S.clientes.find((k) => k.id === id) || { razon: '—' };
const nomC = (c) => c ? `${c.apellidos}, ${c.nombres}` : '—';
const asigActiva = (solId) => S.asignaciones.find((a) => a.solId === solId && a.estadoServicio !== 'Cancelado');

function estadoDoc(d) {
  const t = tdoc(d.tipoDocId);
  if (!t || !t.vence || !d.vence) return 'Vigente';
  if (d.vence < TODAY) return 'Vencido';
  if (diffDays(d.vence, TODAY) <= (t.dias || 30)) return 'Por vencer';
  return 'Vigente';
}
function docsRequeridos(titular, r) {
  return S.tiposDoc.filter((t) => t.activo !== false && t.aplica === titular && (titular === 'C' || !t.tipos.length || t.tipos.includes(r.tipoId)));
}
function docDe(titular, refId, tipoDocId) {
  return S.documentos.filter((d) => d.titular === titular && d.refId === refId && d.tipoDocId === tipoDocId).sort((a, b) => (b.vence || '9999').localeCompare(a.vence || '9999'))[0];
}
/* Habilitación documental (mejora M1) */
function habilitacion(titular, r) {
  const res = { faltan: [], vencidos: [], mina: [], porVencer: [], noBloq: [] };
  docsRequeridos(titular, r).forEach((t) => {
    const d = docDe(titular, r.id, t.id);
    if (!d) { (t.bloq ? res.faltan : res.noBloq).push(t.nombre); return; }
    const e = estadoDoc(d);
    if (e === 'Vencido') (t.bloq ? res.vencidos : res.noBloq).push(t.nombre);
    else if (d.mina === 'Pendiente' && t.bloq) res.mina.push(t.nombre);
    else if (e === 'Por vencer') res.porVencer.push({ nombre: t.nombre, dias: diffDays(d.vence, TODAY) });
  });
  res.estado = (res.faltan.length || res.vencidos.length || res.mina.length) ? 'No habilitado' : (res.porVencer.length || res.noBloq.length) ? 'Con observaciones' : 'Habilitado';
  return res;
}
function chipHab(h) {
  const cls = h.estado === 'Habilitado' ? 'c-ok' : h.estado === 'No habilitado' ? 'c-bad' : 'c-warn';
  const det = [...h.faltan.map((x) => 'Falta: ' + x), ...h.vencidos.map((x) => 'Vencido: ' + x), ...h.mina.map((x) => 'En revisión de mina: ' + x), ...h.porVencer.map((x) => `${x.nombre} vence en ${x.dias} d`)];
  return `<span class="chip ${cls}">${h.estado}</span>${det.length ? `<div class="sub" style="margin-top:3px">${esc(det.join(' · '))}</div>` : ''}`;
}

/* Horarios y horas de manejo (mejora M5) */
const inicio = (s) => new Date(`${s.fecha}T${s.hora}`);
const fin = (s) => new Date(inicio(s).getTime() + s.duracion * 36e5);
function horasAsig(a) {
  const s = solx(a.solId);
  if (a.salida && a.llegada) return Math.max(0, (new Date(a.llegada.replace(' ', 'T')) - new Date(a.salida.replace(' ', 'T'))) / 36e5);
  return s.duracion;
}
function horasConductor(cId, desde, hasta, exclSol) {
  return S.asignaciones.filter((a) => a.condId === cId && a.estadoServicio !== 'Cancelado' && a.solId !== exclSol).reduce((t, a) => {
    const s = solx(a.solId); return (s.fecha >= desde && s.fecha <= hasta) ? t + horasAsig(a) : t;
  }, 0);
}
function semana(fecha) { const d = new Date(fecha + 'T12:00'); const k = (d.getDay() + 6) % 7; const ini = addDays(fecha, -k); return [ini, addDays(ini, 6)]; }
function cruces(recurso, id, sol, excluirSolId) {
  const ini = inicio(sol), f = fin(sol);
  const margen = recurso === 'C' ? DESCANSO_H * 36e5 : 0;
  return S.asignaciones.filter((a) => a.estadoServicio !== 'Cancelado' && a.solId !== excluirSolId && (recurso === 'C' ? a.condId === id : a.vehId === id))
    .map((a) => solx(a.solId)).filter((o) => o && o.estado !== 'Cancelada' && inicio(o) < new Date(f.getTime() + margen) && new Date(fin(o).getTime() + margen) > ini);
}

/* Motor de validación: R1-R5 (versión 1.0, ampliado) + R6-R10 (mejoras) */
function validar(sol, c, v, opts = {}) {
  const r = { bloqueos: [], obs: [], veredicto: 'Aprobada' };
  const B = (code, msg, nuevo) => r.bloqueos.push({ code, msg, nuevo });
  const O = (code, msg, nuevo) => r.obs.push({ code, msg, nuevo });
  const hc = habilitacion('C', c), hv = habilitacion('V', v);
  hc.faltan.forEach((x) => B('R1', `Falta ${x} del conductor`, true));
  hv.faltan.forEach((x) => B('R1', `Falta ${x} del vehículo`, true));
  hc.vencidos.forEach((x) => B('R2', `${x} del conductor vencido`, x !== 'Licencia de conducir'));
  hv.vencidos.forEach((x) => B('R2', `${x} del vehículo vencido`, x !== 'Revisión técnica'));
  hc.mina.forEach((x) => B('R8', `${x} del conductor pendiente de visto bueno de mina`, true));
  hv.mina.forEach((x) => B('R8', `${x} del vehículo pendiente de visto bueno de mina`, true));
  hc.porVencer.forEach((x) => O('R3', `${x.nombre} del conductor vence en ${x.dias} días`));
  hv.porVencer.forEach((x) => O('R3', `${x.nombre} del vehículo vence en ${x.dias} días`));
  hc.noBloq.forEach((x) => O('R3', `${x} del conductor vencido o faltante (no bloqueante)`, true));
  if (v.estado === 'En mantenimiento') B('R4', 'Vehículo en mantenimiento');
  if (v.estado === 'De baja') B('R4', 'Vehículo dado de baja');
  if (c.estado !== 'Disponible') B('R5', `Conductor ${c.estado.toLowerCase()}`);
  const tv = tipo(v.tipoId);
  if (!c.tipos.includes(v.tipoId)) B('R6', `El conductor no está habilitado para manejar ${tv.nombre}`, true);
  else if (yearsSince(c.fLic) < tv.expMin) B('R6', `Experiencia de ${yearsSince(c.fLic)} años; ${tv.nombre} exige ${tv.expMin}`, true);
  if (v.asientos < sol.pasajeros) B('R7', `La unidad tiene ${v.asientos} asientos y la solicitud requiere ${sol.pasajeros}`, true);
  const cc = cruces('C', c.id, sol, sol.id), cv = cruces('V', v.id, sol, sol.id);
  if (cc.length) B('R9', `El conductor tiene el servicio ${cc[0].id} (${fd(cc[0].fecha)} ${cc[0].hora}) que se cruza, contando ${DESCANSO_H} h de descanso`, true);
  if (cv.length) B('R9', `El vehículo tiene el servicio ${cv[0].id} (${fd(cv[0].fecha)} ${cv[0].hora}) que se cruza`, true);
  const [wi, wf] = semana(sol.fecha); const hs = horasConductor(c.id, wi, wf, sol.id);
  if (hs + sol.duracion > LIMITE_SEMANA_H) B('R10', `Superaría el límite semanal: ${Math.round(hs + sol.duracion)} de ${LIMITE_SEMANA_H} h`, true);
  if (v.tipoId !== sol.tipoId) O('Tipo', `La unidad es ${tv.nombre} y se pidió ${tipo(sol.tipoId).nombre}`);
  r.veredicto = r.bloqueos.length ? 'Rechazada' : r.obs.length ? 'Observada' : 'Aprobada';
  return r;
}

/* Ranking de candidatos (mejora M5) */
function ranking(sol) {
  const hasta = TODAY, desde = addDays(TODAY, -30);
  return S.conductores.filter((c) => c.estado === 'Disponible' && c.tipos.includes(sol.tipoId))
    .map((c) => ({ c, h30: horasConductor(c.id, desde, hasta), n30: S.asignaciones.filter((a) => a.condId === c.id && a.estadoServicio !== 'Cancelado' && solx(a.solId).fecha >= desde).length }))
    .map((x) => ({ ...x, hab: habilitacion('C', x.c).estado === 'No habilitado' ? 1 : 0 }))
    .sort((a, b) => a.hab - b.hab || a.h30 - b.h30 || a.n30 - b.n30 || a.c.apellidos.localeCompare(b.c.apellidos));
}
function usoVeh(vId) { const desde = addDays(TODAY, -30); return S.asignaciones.filter((a) => a.vehId === vId && a.estadoServicio !== 'Cancelado' && solx(a.solId).fecha >= desde).reduce((t, a) => t + horasAsig(a), 0); }

function crearAsignacion(sol, c, v, res, origen) {
  const a = { id: uid('A'), solId: sol.id, condId: c.id, vehId: v.id, veredicto: res.veredicto, obs: res.obs.map((o) => `${o.code}: ${o.msg}`), estadoServicio: 'Programado', creada: nowStamp(), checklist: null, salida: null, llegada: null, kmIni: null, kmFin: null, acta: false, origen };
  S.asignaciones.push(a);
  sol.estado = 'Asignada'; sol.motivo = ''; sol.noAtendida = false;
  notificar(c.id, `Nuevo servicio ${sol.id}: ${fd(sol.fecha)} ${sol.hora}, ${sol.origen} → ${sol.destino}, unidad ${v.placa}.`);
  notificar('fin', `Asignar viáticos y combustible para ${sol.id} (${v.placa}, ${nomC(c)}).`);
  res.obs.filter((o) => o.code === 'R3').forEach((o) => alertar('Medio', 'Documento por vencer', o.msg, `${sol.id}-${o.msg}`));
  return a;
}
function asignarAuto(sol, excl = { c: [], v: [] }) {
  const vehs = S.vehiculos.filter((v) => v.estado === 'Disponible' && v.tipoId === sol.tipoId && v.asientos >= sol.pasajeros && !excl.v.includes(v.id)).sort((a, b) => usoVeh(a.id) - usoVeh(b.id) || a.placa.localeCompare(b.placa));
  const conds = ranking(sol).map((x) => x.c).filter((c) => !excl.c.includes(c.id));
  const intentos = [];
  let elegido = null;
  for (const objetivo of ['Aprobada', 'Observada']) {
    for (const c of conds) { for (const v of vehs) { const r = validar(sol, c, v); if (objetivo === 'Aprobada') intentos.push({ c, v, r }); if (r.veredicto === objetivo) { elegido = { c, v, r }; break; } } if (elegido) break; }
    if (elegido) break;
  }
  if (!elegido) {
    sol.estado = 'Reprogramada'; sol.noAtendida = true;
    sol.motivo = !conds.length ? `No hay conductores disponibles habilitados para ${tipo(sol.tipoId).nombre}.` : !vehs.length ? `No hay unidades ${tipo(sol.tipoId).nombre} disponibles con ${sol.pasajeros} asientos o más.` : 'Todas las combinaciones tienen bloqueos documentales, de habilitación o de horario.';
    return { ok: false, msg: sol.motivo, intentos };
  }
  const a = crearAsignacion(sol, elegido.c, elegido.v, elegido.r, 'Automática');
  return { ok: true, a, r: elegido.r, intentos, msg: `Asignación ${elegido.r.veredicto}: ${nomC(elegido.c)} con ${elegido.v.placa}.` };
}

/* Alertas y notificaciones */
function alertar(nivel, tipoA, msg, clave) {
  const ex = S.alertas.find((x) => x.clave === clave && x.estado === 'Activa');
  if (ex) return ex;
  const a = { id: uid('AL'), nivel, tipo: tipoA, msg, clave, estado: 'Activa', fecha: nowStamp() };
  S.alertas.unshift(a); return a;
}
function notificar(para, msg) { S.notificaciones.unshift({ id: uid('N'), para, msg, leida: false, fecha: nowStamp() }); }
function escanear() {
  const activas = new Set();
  const marca = (nivel, t, msg, clave) => { alertar(nivel, t, msg, clave); activas.add(clave); };
  let nA = 0, nM = 0;
  [['C', S.conductores], ['V', S.vehiculos]].forEach(([tit, lista]) => lista.filter((r) => r.estado !== 'De baja').forEach((r) => {
    const nombre = tit === 'C' ? nomC(r) : `vehículo ${r.placa}`;
    docsRequeridos(tit, r).forEach((t) => {
      const d = docDe(tit, r.id, t.id);
      if (!d) { if (t.bloq) { marca('Alto', 'Documento faltante', `Falta ${t.nombre} de ${nombre}`, `F-${r.id}-${t.id}`); nA++; } return; }
      const e = estadoDoc(d);
      if (e === 'Vencido') { marca('Alto', 'Documento vencido', `${t.nombre} de ${nombre} venció hace ${diffDays(TODAY, d.vence)} días`, `V-${d.id}`); nA++; }
      else if (e === 'Por vencer') { marca('Medio', 'Documento por vencer', `${t.nombre} de ${nombre} vence en ${diffDays(d.vence, TODAY)} días`, `P-${d.id}`); nM++; }
      if (d.mina === 'Pendiente') { marca('Medio', 'Pendiente de visto bueno de mina', `${t.nombre} de ${nombre} espera aprobación en 2personnal`, `M-${d.id}`); nM++; }
    });
  }));
  S.valorizaciones.filter((v) => v.estado === 'Facturada' && v.fFactura && diffDays(TODAY, v.fFactura) > DIAS_COBRO).forEach((v) => { marca('Medio', 'Cobro pendiente', `Factura ${v.factura} de ${v.solId} lleva ${diffDays(TODAY, v.fFactura)} días sin pago`, `CB-${v.id}`); nM++; });
  let res = 0;
  S.alertas.forEach((a) => { if (a.estado === 'Activa' && a.clave && /^(F|V|P|M|CB)-/.test(a.clave) && !activas.has(a.clave)) { a.estado = 'Resuelta'; a.resuelta = 'Automática'; res++; } });
  S.ultimoEscaneo = nowStamp();
  return { nA, nM, res };
}

function barsH(data, opts = {}) {
  const max = Math.max(opts.limit || 0, ...data.map((d) => d.v), 1);
  const rowH = 26, lw = opts.lw || 150, W = 520, cw = W - lw - 40, H = data.length * rowH + 22;
  const x = (v) => lw + (v / max) * cw;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W * 1.25}px;display:block" role="img" aria-label="${esc(opts.label || 'gráfico')}">`;
  [0, 0.5, 1].forEach((p) => { s += `<line x1="${x(max * p)}" y1="4" x2="${x(max * p)}" y2="${H - 18}" stroke="var(--line)"/><text x="${x(max * p)}" y="${H - 4}" text-anchor="middle">${Math.round(max * p)}</text>`; });
  data.forEach((d, i) => {
    const y = 6 + i * rowH;
    s += `<text class="lbl" x="${lw - 8}" y="${y + 14}" text-anchor="end">${esc(d.k)}</text><rect x="${lw}" y="${y + 3}" width="${Math.max(2, x(d.v) - lw)}" height="16" rx="3" fill="${d.c || 'var(--info)'}"/><text x="${x(d.v) + 5}" y="${y + 15}">${opts.fmt ? opts.fmt(d.v) : d.v}</text>`;
  });
  if (opts.limit) s += `<line x1="${x(opts.limit)}" y1="2" x2="${x(opts.limit)}" y2="${H - 18}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${x(opts.limit) - 4}" y="12" text-anchor="end" style="fill:var(--bad)">${opts.limitLabel}</text>`;
  return s + '</svg>';
}
function donut(data) {
  const tot = data.reduce((t, d) => t + d.v, 0) || 1; let a0 = -Math.PI / 2; const R = 62, r = 38, cx = 80, cy = 80;
  let s = `<svg class="chart" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Solicitudes por estado">`;

/* ---------- calendario ---------- */
function vCalendario() {
  const base = S.ui.semana || semana(TODAY)[0];
  const dias = [...Array(7)].map((_, i) => addDays(base, i));
  const nombresDia = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const activos = S.conductores.filter((c) => c.estado !== 'De baja');
  let cells = `<div class="hd">Conductor</div>` + dias.map((d, i) => `<div class="hd ${d === TODAY ? 'today' : ''}">${nombresDia[i]} ${fd(d).slice(0, 5)}</div>`).join('');
  activos.forEach((c) => {
    const [wi, wf] = [dias[0], dias[6]];
    cells += `<div><b style="font-size:12.5px">${esc(nomC(c))}</b><div class="hint">${Math.round(horasConductor(c.id, wi, wf))} de ${LIMITE_SEMANA_H} h</div></div>`;
    dias.forEach((d) => {
      const evs = S.asignaciones.filter((a) => a.condId === c.id && a.estadoServicio !== 'Cancelado' && solx(a.solId).fecha === d);
      cells += `<div>${c.estado !== 'Disponible' ? `<span class="hint">${c.estado}</span>` : ''}${evs.map((a) => { const s = solx(a.solId); const cl = a.estadoServicio === 'Completado' ? 'ok' : a.estadoServicio === 'En ruta' ? 'acc' : a.estadoServicio === 'Con incidencia' ? 'bad' : ''; return `<span class="ev-b ${cl}"><b>${s.hora}</b> ${s.id} · ${veh(a.vehId).placa}<br>${s.duracion} h · ${a.estadoServicio}</span>`; }).join('')}</div>`;
    });
  });
  return `
  <div class="ph"><div><h1>Calendario semanal ${NW('M5')}</h1><p>Un conductor solo está ocupado en el horario de su servicio. Así se ven los cruces y la carga de la semana.</p></div>
    <div class="row"><button class="btn" data-act="sem" data-d="-7">Semana anterior</button><button class="btn" data-act="sem" data-d="0">Esta semana</button><button class="btn" data-act="sem" data-d="7">Semana siguiente</button></div></div>
  <div class="tw"><div class="cal">${cells}</div></div>
  <div class="legend"><span><i style="background:var(--info)"></i>Programado</span><span><i style="background:var(--accent)"></i>En ruta</span><span><i style="background:var(--ok)"></i>Completado</span><span><i style="background:var(--bad)"></i>Con incidencia</span></div>`;
}

/* ---------- valorizaciones ---------- */
function calcValorizacion(s, a) {
  const t = S.tarifas.find((r) => r.origen === s.origen && r.destino === s.destino && r.tipoId === veh(a.vehId).tipoId);
  const kmRec = a.kmFin - a.kmIni; const kmIncl = t ? t.km : kmRec; const pkm = t ? t.pkm : 0;
  const kmExceso = Math.max(0, kmRec - kmIncl); const base = s.monto || (t ? t.base : 0);
  return { t, kmRec, kmIncl, pkm, kmExceso, base, monto: Math.round((base + kmExceso * pkm) * 100) / 100 };
}

    close: closeModal,
    login: () => { S.rol = el.dataset.r; S.ui.view = el.dataset.r === 'cond' ? 'misservicios' : el.dataset.r === 'fin' ? 'valorizaciones' : 'inicio'; save(); render(); },
    logout: () => { S.rol = null; save(); render(); },
    go: () => go(el.dataset.v),
    reset: () => confirmar('Restablecer datos de demostración', 'Se borrarán los cambios hechos en este navegador y se cargarán los datos iniciales.', () => { const r = S.rol; S = seed(); S.rol = r; escanear(); save(); render(); toast('Datos de demostración restablecidos.', 'ok'); }, 'Restablecer', 'dan'),
    noti: () => {
      const mine = S.notificaciones.filter((n) => n.para === S.rol || (S.rol === 'cond' && n.para === ROLES.cond.conductorId) || (S.rol === 'admin' && n.para === 'admin')).slice(0, 15);
      modal('Notificaciones', `<div class="list">${mine.map((n) => `<div class="item"><div class="grow">${esc(n.msg)}<div class="sub">${fdt(n.fecha)}</div></div>${n.leida ? '<span class="chip c-mut">Leída</span>' : `<button class="btn sm" data-act="leer" data-id="${n.id}">Marcar leída</button>`}</div>`).join('') || '<p class="hint">No tienes notificaciones.</p>'}</div>`);
    },
    leer: () => { const n = S.notificaciones.find((x) => x.id === id); n.leida = true; save(); const open = !!$('#ov'); render(); if (open) A.noti(); },
    scan: () => { const r = escanear(); save(); render(); toast(`Escaneo completo: ${r.nA} alertas de riesgo alto, ${r.nM} de riesgo medio, ${r.res} resueltas automáticamente.`, 'ok'); },
    'al-res': () => { const a = S.alertas.find((x) => x.id === id); a.estado = 'Resuelta'; a.resuelta = 'Manual'; save(); render(); toast('Alerta marcada como resuelta.', 'ok'); },
    'cond-new': () => formConductor(), 'cond-ver': () => verConductor(id), 'cond-edit': () => formConductor(cond(id)),
    'cond-baja': () => confirmar('Dar de baja al conductor', `${esc(nomC(cond(id)))} dejará de aparecer como disponible. Su historial se conserva.`, () => { cond(id).estado = 'De baja'; save(); render(); toast('Conductor dado de baja.', 'ok'); }, 'Dar de baja', 'dan'),
    'veh-new': () => formVehiculo(), 'veh-ver': () => verVehiculo(id), 'veh-edit': () => formVehiculo(veh(id)),
    'doc-new': () => formDocumento(el.dataset.tit, el.dataset.ref, el.dataset.tipo),
    'mina-ok': () => { const d = S.documentos.find((x) => x.id === id); d.mina = 'Aprobado'; escanear(); save(); const r = d.titular === 'C' ? cond(d.refId) : veh(d.refId); closeModal(); render(); toast(`Visto bueno de mina registrado: ${tdoc(d.tipoDocId).nombre}. Habilitación: ${habilitacion(d.titular, r).estado}.`, 'ok'); },
    'sol-new': () => formSolicitud(), 'sol-edit': () => formSolicitud(solx(id)), 'sol-ver': () => verSolicitud(id), 'sol-cancel': () => cancelarSolicitud(id),
    auto: () => { const s = solx(id); const r = asignarAuto(s); save(); render();
      modal(`Asignación automática de ${id}`, `${r.ok ? mostrarResultado(r.r) : `<div class="verdict v-bad"><b>Solicitud reprogramada</b><span>${esc(r.msg)}</span></div>`}
        <div class="hint">Se evaluaron ${r.intentos.length} combinaciones con el orden del ranking ${NW('M5')}.</div>
        ${r.intentos.length ? `<div class="tw"><table><thead><tr><th>Conductor</th><th>Vehículo</th><th>Veredicto</th><th>Motivo</th></tr></thead><tbody>${r.intentos.slice(0, 10).map((x) => `<tr><td>${esc(nomC(x.c))}</td><td class="mono">${x.v.placa}</td><td><span class="chip ${x.r.veredicto === 'Aprobada' ? 'c-ok' : x.r.veredicto === 'Observada' ? 'c-warn' : 'c-bad'}">${x.r.veredicto}</span></td><td class="sub">${esc([...x.r.bloqueos, ...x.r.obs].map((b) => b.code + ' ' + b.msg).join('; '))}</td></tr>`).join('')}</tbody></table></div>` : ''}
        <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cerrar</button></div>`, true); },
    manual: () => abrirManual(id),
    sem: () => { const d = +el.dataset.d; S.ui.semana = d === 0 ? null : addDays(S.ui.semana || semana(TODAY)[0], d); save(); render(); },
    ck: () => formChecklist(id), salida: () => registrarSalida(id), llegada: () => formLlegada(id), incid: () => formIncidencia(id),
    reemplazo: () => { const a = S.asignaciones.find((x) => x.id === id); reemplazo(id, 'Incidencia grave: se activó una unidad de reemplazo', { c: [a.condId], v: [a.vehId] }); },
    reasignar: () => { const a = S.asignaciones.find((x) => x.id === id); const ck = a.checklist || {}; const fallaUnidad = ['frenos', 'llantas', 'luces', 'cinturones'].some((k) => ck[k] === false); reemplazo(id, 'Checklist no apto: se reasignó el servicio', { c: [a.condId], v: fallaUnidad ? [a.vehId] : [] }); },
    continuar: () => { const a = S.asignaciones.find((x) => x.id === id); a.estadoServicio = 'En ruta'; save(); render(); toast('El servicio continúa en ruta.', 'ok'); },
    'val-gen': () => generarValorizacion(id), 'val-ver': () => verValorizacion(id),
    'val-obs': () => { const v = S.valorizaciones.find((x) => x.id === id); v.estado = 'Observada'; v.obs = 'El kilometraje no coincide con el reporte del cliente.'; save(); render(); verValorizacion(id); toast('Valorización observada. Se corrige sobre los datos registrados y se reenvía.'); },
    csv: () => { const k = el.dataset.k; const txt = DATASETS[k].f();
      modal(k, `<textarea id="csvt" class="mono" style="min-height:260px;font-size:12px" readonly>${esc(txt)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cerrar</button><button class="btn pri" id="cpy">Copiar al portapapeles</button></div>`, true);
      $('#cpy').onclick = () => { const t = $('#csvt'); if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('CSV copiado.', 'ok'), () => { t.select(); toast('Selecciona y copia el texto con Ctrl+C.'); }); else { t.select(); toast('Selecciona y copia el texto con Ctrl+C.'); } }; },
    'tipo-new': () => formTipo(), 'tipo-edit': () => formTipo(tipo(id)),
    'req-bloq': () => { const t = tdoc(id); t.bloq = el.checked; save(); render(); toast(`${t.nombre} ${t.bloq ? 'ahora bloquea' : 'ya no bloquea'} la asignación.`, 'ok'); },
    ...DEMOS,
  };
  if (A[act]) { if (el.tagName !== 'INPUT') e.preventDefault(); A[act](); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === 'cond') guardarConductor(f);
  else if (k === 'veh') guardarVehiculo(f);
  else if (k === 'doc') guardarDocumento(f);
  else if (k === 'sol') guardarSolicitud(f);
  else if (k === 'manual') confirmarManual(f);
  else if (k === 'ck') guardarChecklist(f);
  else if (k === 'llegada') guardarLlegada(f);
  else if (k === 'incid') guardarIncidencia(f);
  else if (k === 'val') avanzarValorizacion(f);
  else if (k === 'cancel') { const s = solx(f.dataset.id); const m = new FormData(f).get('motivo'); s.estado = 'Cancelada'; s.motivo = m; const a = asigActiva(s.id); if (a) { a.estadoServicio = 'Cancelado'; a.cancelada = nowStamp(); a.motivoCancel = m; notificar(a.condId, `El servicio ${s.id} fue cancelado: ${m}`); } closeModal(); save(); render(); toast(`Solicitud ${s.id} cancelada.`, 'ok'); }
  else if (k === 'tipo') { const d = Object.fromEntries(new FormData(f)); const data = { nombre: d.nombre, asientos: +d.asientos, expMin: +d.expMin, cat: d.cat, activo: !!d.activo }; if (f.dataset.id) Object.assign(tipo(f.dataset.id), data); else S.tipos.push({ id: uid('T'), ...data }); closeModal(); save(); render(); toast('Tipo de vehículo guardado. Ya aparece en los formularios.', 'ok'); }
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-filter]'); if (!el) return;
  S.ui.filtros[el.dataset.filter] = el.value; save();
  const pos = el.selectionStart; const idf = el.id; render(); const n = document.getElementById(idf); if (n) { n.focus(); if (n.setSelectionRange && pos != null) try { n.setSelectionRange(pos, pos); } catch (er) { /* no aplica */ } }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ---------- arranque ---------- */
S = load() || seed();
if (!S.ultimoEscaneo || S.ultimoEscaneo.slice(0, 10) !== TODAY) escanear(); // escaneo automático diario al primer acceso
save(); render();
</script>
</body></html>
